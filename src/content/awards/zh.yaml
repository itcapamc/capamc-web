title: 奖励与奖学金
intro: >-
  CAPA-MC 通过两个标志性项目，表彰在社区中领导并服务的青少年。
items:
  - name: Dr. Alan Cheung 社区领导力奖学金
    type: 奖学金
    description: >-
      这项社区领导力奖学金旨在鼓励、培育并表彰投身社区服务的青少年个人与团体的贡献。
      奖学金以 Dr. Alan Cheung 命名——他是蒙郡公立学校教育委员会首位亚裔委员
      （1990–1998）。2026 年 CAPA-MC 计划颁发 15 个个人奖与 5 个团体奖。
      申请于 2026 年 2 月 22 日开放，申请说明提供中英文两种版本。
      咨询请联系 scholarship@capamc.org。
    deadline: "2026 年 3 月 22 日 23:59（美东时间）"
  - name: 总统志愿服务奖（PVSA）
    type: 表彰
    description: >-
      这是美国国家与社区服务公司（Corporation for National and Community Service）
      发起的项目，表彰我们每个人在改善社区方面所能带来的影响。CAPA-MC 是获授权的
      认证机构。符合条件的志愿者须为美国公民或合法永久居民，并在 4 月 1 日至次年
      3 月 31 日期间完成合规服务，其中至少 20%（不少于 20 小时）来自 CAPA-MC
      下属社团活动。奖项等级：铜、银、金及终身成就奖。提交至 pvsa@capamc.org。
