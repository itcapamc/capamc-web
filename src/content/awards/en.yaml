title: Awards & scholarships
intro: >-
  CAPA-MC recognizes youth who lead and serve their communities through two signature
  programs.
items:
  - name: Dr. Alan Cheung Community Leadership Scholarship
    type: Scholarship
    description: >-
      This community leadership scholarship encourages, fosters, and recognizes the
      contribution of dedicated youth individuals and youth groups to community
      service. It honors Dr. Alan Cheung, the first Asian American on the Montgomery
      County Public School Board (1990–1998). For 2026, CAPA-MC plans to award 15
      individual and 5 group scholarships. Applications open February 22, 2026;
      instructions are available in English and Chinese. Questions:
      scholarship@capamc.org.
    deadline: "March 22, 2026, 11:59 p.m. ET"
  - name: President's Volunteer Service Award (PVSA)
    type: Recognition
    description: >-
      An initiative of the Corporation for National and Community Service that
      celebrates the impact we can all make in bettering our communities. CAPA-MC is
      an authorized certifying organization. Eligible volunteers must be U.S.
      citizens or lawful permanent residents and complete qualifying service within
      the April 1 – March 31 period, with at least 20% (minimum 20 hours) from
      CAPA-MC-affiliated club activities. Award levels: Bronze, Silver, Gold, and
      Lifetime Achievement. Submit to pvsa@capamc.org.
