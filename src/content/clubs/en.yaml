title: Student clubs
intro: >-
  CAPA-MC is home to a diverse range of clubs comprised of talented and passionate
  students spanning from elementary to high school levels.
items:
  - name: Chinese American Parents and Students Association (CAPSA)
    category: Community
    link: https://www.capsa-mc.org/
    description: >-
      Founded in 1988, CAPSA supports the Chinese American community by promoting
      cross-cultural understanding and assisting new immigrant families in
      Montgomery County's educational system.
  - name: Growing & Giving Club (G&G)
    category: Service
    link: https://sites.google.com/view/capa-mcggc/
    description: >-
      Dedicated to serving the community through organic gardening and helping those
      in need while promoting eco-friendly practices.
  - name: Junior Reporter Club (JRC)
    category: Journalism
    link: https://www.capajrc.org/
    description: >-
      A group of second-generation Chinese Americans who aim to make a positive
      difference in the Chinese American community through journalism.
  - name: IT Club
    category: Technology
    link: https://capamc.org/?page_id=420
    description: Provides free, high-quality IT services to local clubs and organizations.
  - name: iTeach Club
    category: Education
    link: https://www.iteachcapa.org/
    description: >-
      Delivers weekly online English lessons to seniors, having served over 120
      participants.
  - name: iHear Program
    category: Inclusion
    link: https://ihearprogram.org
    description: >-
      Dedicated to innovation, language learning, and promoting communication
      inclusivity, supporting students with hearing impairments.
  - name: Special Education Equal Development Society (SEEDS)
    category: Advocacy
    link: https://growthxtogether.wixsite.com/seeds
    description: >-
      A student-led disability awareness initiative focused on increasing
      opportunities for special education students.
  - name: Run and Hit Tennis Club (RHTC)
    category: Sports
    link: https://capamc.org/?page_id=845
    description: >-
      A student-run sports club hosting tennis sessions to improve skills and
      promote the sport.
  - name: THRIVE Club
    category: Wellness
    link: http://thrive.capamc.org
    description: Promotes overall well-being through resilience and healthy living practices.
  - name: Youth Volleyball and Basketball Club
    category: Sports
    link: https://capamc.org/youth-volleyball-and-basketball-club/
    description: Provides basic training and promotes youth health through sports.
  - name: Youth Service Club
    category: Service
    link: https://capamc.org/youth-service-club/
    description: Hosts seminars, food drives, and community service initiatives.
  - name: Maryland Youth Wushu Club
    category: Culture
    description: Teaches martial arts classes and promotes Chinese culture.
  - name: CAPA Youth Running Club
    category: Sports
    description: Organizes weekly Sunday running sessions promoting healthy lifestyles.
  - name: Music Angels Club
    category: Music
    description: >-
      Performs at senior centers and community events, highlighting the healing
      power of music.
  - name: Hearts of Comfort
    category: Service
    link: https://heartsofcomfort.org
    description: >-
      Provides handmade heart pillows to patients and seniors, offering comfort,
      support, and care.
