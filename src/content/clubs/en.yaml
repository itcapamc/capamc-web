title: Student clubs
intro: CAPA-MC is home to a diverse range of clubs comprised of talented and
  passionate students spanning from elementary to high school levels.
items:
  - name: Chinese American Parents and Students Association (CAPSA)
    category: Community
    description: Founded in 1988, CAPSA supports the Chinese American community by
      promoting cross-cultural understanding and assisting new immigrant
      families in Montgomery County's educational system.
    link: https://www.capsa-mc.org/
  - name: Growing & Giving Club (G&G)
    category: Service
    description: Dedicated to serving the community through organic gardening and
      helping those in need while promoting eco-friendly practices.
    link: https://sites.google.com/view/capa-mcggc/
  - name: Junior Reporter Club (JRC)
    category: Journalism
    description: A group of second-generation Chinese Americans who aim to make a
      positive difference in the Chinese American community through journalism.
    link: https://www.capajrc.org/
  - name: IT Club
    category: Technology
    description: Provides free, high-quality IT services to local clubs and organizations.
    link: https://capamc.org/?page_id=420
  - name: iTeach Club
    category: Education
    description: Delivers weekly online English lessons to seniors, having served
      over 120 participants.
    link: https://www.iteachcapa.org/
  - name: iHear Program
    category: Inclusion
    description: Dedicated to innovation, language learning, and promoting
      communication inclusivity, supporting students with hearing impairments.
    link: https://ihearus.org
  - name: Special Education Equal Development Society (SEEDS)
    category: Advocacy
    description: A student-led disability awareness initiative focused on increasing
      opportunities for special education students.
    link: https://growthxtogether.wixsite.com/seeds
  - name: Run and Hit Tennis Club (RHTC)
    category: Sports
    description: A student-run sports club hosting tennis sessions to improve skills
      and promote the sport.
    link: https://capamc.org/?page_id=845
  - name: THRIVE Club
    category: Wellness
    description: Promotes overall well-being through resilience and healthy living
      practices.
    link: http://thrive.capamc.org
  - name: Youth Volleyball and Basketball Club
    category: Sports
    description: Provides basic training and promotes youth health through sports.
    link: https://capamc.org/youth-volleyball-and-basketball-club/
  - name: Youth Service Club
    category: Service
    description: Hosts seminars, food drives, and community service initiatives.
    link: https://capamc.org/youth-service-club/
  - name: Maryland Youth Wushu Club
    category: Culture
    description: Teaches martial arts classes and promotes Chinese culture.
  - name: CAPA Youth Running Club
    category: Sports
    description: Organizes weekly Sunday running sessions promoting healthy lifestyles.
  - name: Music Angels Club
    category: Music
    description: Performs at senior centers and community events, highlighting the
      healing power of music.
  - name: Hearts of Comfort
    category: Service
    description: Provides handmade heart pillows to patients and seniors, offering
      comfort, support, and care.
    link: https://heartsofcomfort.org
